name: Build iOS IPA (MyMeal)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Copy Web Assets to iOS Native
        run: |
          mkdir -p ios/App/App/public
          cp -r dist/* ios/App/App/public/
          npx cap copy ios || true

      - name: Build iOS App (.app)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Payload into .ipa
        run: |
          mkdir -p Payload
          cp -r ios/App/derived_data/Build/Products/Release-iphoneos/App.app Payload/
          zip -r MyMeal.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyMeal-Unsigned-IPA
          path: MyMeal.ipa
          retention-days: 14
